<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Crédito rotativo | Relatório</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="/css/app.css" rel="stylesheet">
</head>
<body>
  <main class="container py-4">
    <header class="d-flex justify-content-between align-items-center mb-4"><h1 class="h3 mb-0">Relatório de avaliações</h1><a class="btn btn-outline-primary" href="/">Nova avaliação</a></header>
    <div id="feedback" aria-live="polite"></div>
    <form id="report-filters" class="card card-body shadow-sm mb-4">
      <div class="row g-3 align-items-end">
        <div class="col-md-3"><label class="form-label" for="decision">Decisão</label><select class="form-select" id="decision" name="decision"><option value="">Todas</option><option value="APPROVED">Aprovada</option><option value="REJECTED">Reprovada</option></select></div>
        <div class="col-md-3"><label class="form-label" for="from">De</label><input class="form-control" id="from" name="from" type="date"></div>
        <div class="col-md-3"><label class="form-label" for="to">Até</label><input class="form-control" id="to" name="to" type="date"></div>
        <div class="col-md-3 d-flex gap-2"><button class="btn btn-primary" type="submit">Consultar</button><button class="btn btn-outline-secondary" id="download-pdf" type="button">Baixar PDF</button></div>
      </div>
    </form>
    <section id="report-results" aria-live="polite"></section>
  </main>
  <script type="module" src="/ts/report.ts"></script>
</body>
</html>
