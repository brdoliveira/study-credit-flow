<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Crédito rotativo | Avaliação</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="/css/app.css" rel="stylesheet">
</head>
<body>
  <main class="container py-4">
    <header class="d-flex justify-content-between align-items-center mb-4">
      <div><h1 class="h3 mb-1">Avaliação de crédito rotativo</h1><p class="text-body-secondary mb-0">Fluxo demonstrativo para operadores autorizados.</p></div>
      <div class="d-flex gap-2"><a class="btn btn-outline-primary" data-authority="SCOPE_credit:report" href="/report.html">Consultar relatório</a><button class="btn btn-outline-secondary" id="logout" type="button">Sair</button></div>
    </header>
    <div id="feedback" aria-live="polite"></div>
    <form id="evaluation-form" data-authority="SCOPE_credit:write" class="card card-body shadow-sm" novalidate>
      <div class="row g-3">
        <div class="col-md-6"><label class="form-label" for="name">Nome</label><input class="form-control" id="name" name="name" required></div>
        <div class="col-md-3"><label class="form-label" for="cpf">CPF</label><input class="form-control" id="cpf" name="cpf" inputmode="numeric" required></div>
        <div class="col-md-3"><label class="form-label" for="creditScore">Score</label><input class="form-control" id="creditScore" name="creditScore" type="number" min="0" max="1000" required></div>
        <div class="col-md-4"><label class="form-label" for="currentInvoiceAmount">Fatura atual (R$)</label><input class="form-control" id="currentInvoiceAmount" name="currentInvoiceAmount" type="number" min="0" step="0.01" required></div>
        <div class="col-md-4"><label class="form-label" for="totalLimit">Limite total (R$)</label><input class="form-control" id="totalLimit" name="totalLimit" type="number" min="0.01" step="0.01" required></div>
        <div class="col-md-4"><label class="form-label" for="availableLimit">Limite disponível (R$)</label><input class="form-control" id="availableLimit" name="availableLimit" type="number" min="0" step="0.01" required></div>
        <div class="col-md-3"><label class="form-label" for="latePayments">Atrasos</label><input class="form-control" id="latePayments" name="latePayments" type="number" min="0" required></div>
        <div class="col-md-9"><label class="form-label" for="monthlySpending">Gastos dos últimos 3 meses (R$, separados por vírgula)</label><input class="form-control" id="monthlySpending" name="monthlySpending" placeholder="1500, 1700, 1800" required></div>
      </div>
      <div class="mt-4"><button class="btn btn-primary" type="submit">Avaliar crédito</button></div>
    </form>
    <section id="decision" class="mt-4" aria-live="polite"></section>
  </main>
  <script type="module">import { initialiseSession } from "/ts/session.ts"; initialiseSession();</script><script type="module" src="/ts/evaluation.ts"></script>
</body>
</html>
