global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: [alertmanager:9093]

scrape_configs:
  - job_name: credit-flow
    metrics_path: /actuator/prometheus
    oauth2:
      client_id: credit-observability
      client_secret_file: /tmp/client-secret
      token_url: http://keycloak:8080/realms/credit-rotativo/protocol/openid-connect/token
    static_configs:
      - targets: [app:8080]
        labels:
          environment: local
